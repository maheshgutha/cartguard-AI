services:
  # ── 1. Python FastAPI Machine Learning & Multi-Agent Core ────────────────
  - type: web
    name: cartguard-ml-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: cartguard
      - key: GROQ_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: WPPCONNECT_API_URL
        fromService:
          type: web
          name: cartguard-wppconnect
          property: host
      - key: WPPCONNECT_SESSION
        value: cartguard

  # ── 2. Node.js Express E-Commerce & Admin API Gateway ─────────────────────
  - type: web
    name: cartguard-server
    env: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: cartguard-ml-backend
          property: host
      - key: WPPCONNECT_API_URL
        fromService:
          type: web
          name: cartguard-wppconnect
          property: host
      - key: CLIENT_URL
        value: "*"

  # ── 3. WPPConnect WhatsApp Puppeteer Daemon ──────────────────────────────
  - type: web
    name: cartguard-wppconnect
    env: docker
    region: oregon
    plan: free
    rootDir: wppconnect-server
    dockerfilePath: Dockerfile
    envVars:
      - key: SECRET_KEY
        value: THISISMYSECURETOKEN
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"
